[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantlab-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "numpy",
  "pandas",
  "pydantic-settings",
  "tushare",
  "uvicorn[standard]",
]

[project.optional-dependencies]
dev = ["httpx", "pytest", "pytest-cov"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
