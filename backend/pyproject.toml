[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantlab-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "numpy==2.5.2",
  "pandas==3.0.5",
  "pydantic-settings==2.15.0",
  "tushare==1.4.29",
  "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "httpx2==2.12.0",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
]

[tool.uv]
constraint-dependencies = [
  "anyio==4.14.2",
  "httpx2==2.12.0",
  "pydantic==2.13.4",
  "starlette==1.6.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
